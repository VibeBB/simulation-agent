name: Dependency update check

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-dependency-updates
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Creates, edits, and closes the "Dependency update check report" issue.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          cache-suffix: dependency-updates
      - name: Sync dependencies
        run: uv sync --locked
      - name: Collect update candidates
        id: report
        run: |
          set -euo pipefail
          uv run python scripts/check_dependency_updates.py \
            --markdown "$RUNNER_TEMP/report.md" --json "$RUNNER_TEMP/report.json"
          printf '\nworkflow run: %s\n' \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >> "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          python3 - "$RUNNER_TEMP/report.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report:
              data = json.load(report)
          print(f"outdated={data['outdated_count']}")
          print(f"unknown_count={data.get('unknown_count', 0)}")
          PY
      - name: Post report to issue
        env:
          GH_TOKEN: ${{ github.token }}
          OUTDATED: ${{ steps.report.outputs.outdated }}
          UNKNOWN_COUNT: ${{ steps.report.outputs.unknown_count }}
        run: |
          # gh issue create fails with "could not add label" when the label
          # does not exist (observed before the first report issue landed).
          gh label create dependency-updates --repo "$GITHUB_REPOSITORY" \
            --color 0366d6 --description "Dependency update report" --force
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label dependency-updates \
            --search "in:title Dependency update check report" \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md"
          else
            number=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Dependency update check report" \
              --label dependency-updates --body-file "$RUNNER_TEMP/report.md" | sed 's#.*/##')
          fi
          if [ "$OUTDATED" = "0" ] && [ "$UNKNOWN_COUNT" = "0" ] && [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "All checked dependencies are current."
          fi
