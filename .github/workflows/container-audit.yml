name: Container hardening audit

on:
  schedule:
    # Monday + Thursday: a CVE disclosed mid-week lands inside ~3 days
    # instead of ~6.
    - cron: "37 3 * * 1"
    - cron: "37 3 * * 4"
  push:
    branches: [main]
    paths:
      - ".github/workflows/container-audit.yml"
      - "docker/image-digests.json"
      - "docker/lynis-container.prf"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Pulls the pinned images from ghcr.io.
      packages: read
      # Uploads the Trivy SARIF scans to code scanning.
      security-events: write
      # Creates, edits, and closes the "Container hardening report" issue.
      issues: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve pinned images
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          import subprocess
          import sys

          entries = json.load(open("docker/image-digests.json", encoding="utf-8"))
          pairs = []
          # Audit every published lock entry; entries without a digest
          # (sim_tools_em is not published yet) are skipped.
          for key in sorted(entries):
              entry = entries[key]
              if entry.get("digest"):
                  name = entry["image"].rsplit("/", 1)[-1]
                  pairs.append(f"{name}={entry['image']}@{entry['digest']}")
          if not pairs:
              raise SystemExit("no published images in docker/image-digests.json")
          print("PINNED_IMAGES=" + " ".join(pairs))
          # The CIS/Lynis probes run against the published tools image:
          # resolve it by explicit lock key through print_locked_image.py
          # so it gets the same structural validation locked-image-check
          # applies — never alphabetical order over the lock entries.
          ref = subprocess.run(
              [sys.executable, "scripts/print_locked_image.py", "--entry", "sim_tools"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          print("PRIMARY_IMAGE=" + ref)
          # The CIS scan leg's cache dir; the actions/cache step below
          # persists the ~120MB vulnerability DB across the weekly runs
          # instead of re-downloading it every time. The per-image scan
          # leg runs concurrently on a private copy.
          print("TRIVY_CACHE_DIR=" + os.path.join(os.environ["HOME"], ".cache", "trivy"))
          PY
      - name: Pull pinned images
        run: |
          set -euo pipefail
          for pair in $PINNED_IMAGES; do
            ref="${pair#*=}"
            for attempt in 1 2 3 4 5; do
              if docker pull "$ref"; then break; fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::docker pull $ref failed after 5 attempts" >&2
                exit 1
              fi
              echo "docker pull $ref attempt $attempt failed; retrying" >&2
              sleep $((attempt * 10))
            done
          done
      - name: Resolve Trivy DB cache key
        id: trivy_week
        run: echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Trivy vulnerability DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          # ISO-week key: the vulnerability DB refreshes daily upstream;
          # a weekly key bounds staleness while sharing the ~120MB
          # download across the job's scans and across weekly runs.
          key: trivy-db-${{ runner.os }}-${{ steps.trivy_week.outputs.week }}
          restore-keys: |
            trivy-db-${{ runner.os }}-
      # The per-image scans loop over every pinned digest, so they use the
      # trivy CLI (via setup-trivy) rather than one trivy-action step each.
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
      - name: Warm the Trivy DB for the raw-trivy scan legs
        # Populate the shared seed dir serially; each leg copies it into a
        # private cache dir first and only ever writes there. Concurrent
        # trivy processes in one cache dir race on db/metadata.json and
        # corrupt it.
        run: |
          trivy image --download-db-only
          # The java-db mirror blob is ~934 MB; if the image ships jars,
          # every leg would otherwise fetch it into its private cache dir at
          # once (the disk-quota kill on the dashboard audit). Warm it once
          # into the shared seed so the per-leg copies carry it.
          trivy image --download-java-db-only
      # The scans read the same pinned images, each writes a disjoint report
      # path, and each trivy process writes to its own cache dir, so they
      # run as one parallel group (implicit wait at the end).
      - parallel:
          - name: Scan pinned images (Trivy JSON, SARIF via convert)
            env:
              # Private dir: this leg runs concurrently with the CIS scan.
              TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache-scan
            run: |
              set -euo pipefail
              # Seed the private dir with the just-warmed DB so no download
              # or metadata update is needed inside this leg.
              mkdir -p "$TRIVY_CACHE_DIR"
              cp -a "$HOME/.cache/trivy/." "$TRIVY_CACHE_DIR/"
              mkdir -p sarif reports
              for pair in $PINNED_IMAGES; do
                name="${pair%%=*}"
                ref="${pair#*=}"
                # The digest is frozen; the vulnerability DB is not — the scan
                # surfaces newly disclosed CVEs against the shipped tools
                # images. One scan per image: the SARIF for code scanning is
                # derived from the same JSON (trivy convert has no
                # --ignore-unfixed, so unfixed vulnerabilities are dropped
                # first and --severity applies the HIGH/CRITICAL limit).
                trivy image --scanners vuln,secret,misconfig,license \
                  --include-non-failures \
                  --format json --output "reports/trivy-${name}.json" "$ref"
                jq '.Results = ((.Results // []) | map(if .Vulnerabilities then
                      .Vulnerabilities |= map(select((.FixedVersion // "") != "")) else . end))' \
                  "reports/trivy-${name}.json" > "$RUNNER_TEMP/trivy-${name}-sarif.json"
                trivy convert --format sarif --severity HIGH,CRITICAL \
                  --output "sarif/trivy-${name}.sarif" "$RUNNER_TEMP/trivy-${name}-sarif.json"
              done
          - name: Run Docker CIS compliance report (primary image)
            env:
              # Private dir: this leg runs concurrently with the scan leg.
              TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache-cis
            run: |
              set -euo pipefail
              mkdir -p "$TRIVY_CACHE_DIR"
              cp -a "$HOME/.cache/trivy/." "$TRIVY_CACHE_DIR/"
              # trivy exits 0 even when a mirror flake yields an empty Results
              # payload, so the retry keys on the MisconfSummary content, not
              # the exit code.
              for attempt in 1 2 3; do
                if trivy image --compliance docker-cis-1.6.0 --include-non-failures --report all \
                  --ignorefile /dev/null --format json \
                  --output "$RUNNER_TEMP/trivy-cis.json" "${PRIMARY_IMAGE}" && \
                  python3 scripts/trivy_report_utils.py cis-nonempty \
                  "$RUNNER_TEMP/trivy-cis.json"; then
                  exit 0
                fi
                if [ "$attempt" -eq 2 ]; then
                  echo "::error::Docker CIS scan produced an empty results payload after retry" >&2
                  exit 1
                fi
                echo "CIS scan returned an empty results payload; retrying once" >&2
                sleep 15
              done
          - name: Run informational Lynis audit inside the primary image
            id: lynis
            continue-on-error: true
            env:
              LYNIS_OUT: ${{ runner.temp }}/lynis-out
            run: |
              set -uo pipefail
              git clone --depth 1 --branch 3.1.7 \
                https://github.com/CISOfy/lynis "$RUNNER_TEMP/lynis"
              # Tags are re-pointable: pin the audit to the exact 3.1.7 commit.
              # A re-pointed tag fails this checkout instead of silently running
              # different audit code.
              git -C "$RUNNER_TEMP/lynis" checkout --detach \
                2e99f92265760b73fd6b139868eb8d4116624030
              # tests/test_workflow_paths.py requires every workflow
              # `docker run --user` to be the image's `sim` user — Lynis runs
              # unprivileged here, which is acceptable for a trend-only audit.
              mkdir -p "$LYNIS_OUT"
              chmod 777 "$LYNIS_OUT"
              docker run --rm --user sim \
                -v "$RUNNER_TEMP/lynis:/lynis:ro" \
                -v "$GITHUB_WORKSPACE/docker/lynis-container.prf:/container.prf:ro" \
                -v "$LYNIS_OUT:/out" \
                --entrypoint /bin/sh "$PRIMARY_IMAGE" \
                -c 'cd /lynis && ./lynis audit system --quick --no-colors \
                    --profile /container.prf \
                    --report-file /out/lynis-report.dat --logfile /out/lynis.log \
                    --auditor github-actions; \
                    # Lynis writes its outputs with umask 027 (0640 sim-owned):
                    # loosen them so the runner-side grep below can read them.
                    chmod 644 /out/lynis-report.dat /out/lynis.log 2>/dev/null' || true
              index=$(grep '^hardening_index=' "$LYNIS_OUT/lynis-report.dat" \
                | head -1 | cut -d= -f2 || true)
              warnings=$(grep -c '^warning\[\]' "$LYNIS_OUT/lynis-report.dat" || true)
              printf 'hardening_index=%s\nwarnings=%s\n' \
                "${index:-unknown}" "${warnings:-0}" >> "$GITHUB_OUTPUT"
      - name: Upload Trivy SARIF (sim-tools)
        if: always() && hashFiles('sarif/trivy-sim-tools.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: sarif/trivy-sim-tools.sarif
          category: trivy-sim-tools-audit
      # Dormant until sim_tools_em gains a published digest; hashFiles keeps
      # the step skipped while no SARIF exists for it.
      - name: Upload Trivy SARIF (sim-tools-em)
        if: always() && hashFiles('sarif/trivy-sim-tools-em.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: sarif/trivy-sim-tools-em.sarif
          category: trivy-sim-tools-em-audit
      - name: Compute container-hardening report
        env:
          LYNIS_OUT: ${{ runner.temp }}/lynis-out
          REPORTS_DIR: reports
          TRIVY_CIS: ${{ runner.temp }}/trivy-cis.json
          REPORT_JSON: container-hardening.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import os
          import sys
          from collections import Counter

          refs = {}
          for pair in os.environ["PINNED_IMAGES"].split():
              name, ref = pair.split("=", 1)
              refs[name] = ref

          images = {}
          fixable_total = 0
          for path in sorted(glob.glob(os.path.join(os.environ["REPORTS_DIR"],
                                                    "trivy-*.json"))):
              name = os.path.basename(path)[len("trivy-"):-len(".json")]
              trivy = json.load(open(path, encoding="utf-8"))
              vulns, secrets, licenses = Counter(), Counter(), 0
              mis_pass = mis_total = 0
              fixable_high = 0
              for result in trivy.get("Results", []):
                  for v in result.get("Vulnerabilities") or []:
                      sev = v.get("Severity", "UNKNOWN").lower()
                      fixed = bool(v.get("FixedVersion"))
                      vulns[sev] += 1
                      if fixed:
                          vulns[f"{sev}_fixed"] += 1
                          if sev in ("critical", "high"):
                              fixable_high += 1
                  mis = result.get("Misconfigurations") or []
                  for m in mis:
                      mis_total += 1
                      if m.get("Status") == "PASS":
                          mis_pass += 1
                  for s in result.get("Secrets") or []:
                      secrets[s.get("Severity", "UNKNOWN").lower()] += 1
                  for lic in result.get("Licenses") or []:
                      licenses += 1
              image, _, digest = refs.get(name, "@unknown").partition("@")
              images[name] = {
                  "image": image,
                  "digest": digest,
                  "trivy": {
                      "critical": vulns["critical"],
                      "high": vulns["high"],
                      "medium": vulns["medium"],
                      "low": vulns["low"],
                      "fixable_high_or_critical": fixable_high,
                      "misconfig_pass": mis_pass,
                      "misconfig_total": mis_total,
                      "secrets": sum(secrets.values()),
                      "license_findings": licenses,
                  },
              }
              fixable_total += fixable_high
          cis = {"passed": 0, "failed": 0}
          try:
              cis_data = json.load(open(os.environ["TRIVY_CIS"], encoding="utf-8"))
          except (OSError, ValueError):
              cis_data = {}

          # trivy --compliance nests check summaries below the top-level
          # Results; walk the tree recursively so none are missed.
          def _summaries(node):
              yield node
              for child in node.get("Results") or []:
                  yield from _summaries(child)
          for result in _summaries(cis_data):
              summary = result.get("MisconfSummary") or {}
              cis["passed"] += int(summary.get("Successes", 0))
              cis["failed"] += int(summary.get("Failures", 0))
          if cis["passed"] + cis["failed"] == 0:
              # dead telemetry must fail, not masquerade as coverage
              sys.exit("Docker CIS scan produced no results")
          lynis = {"hardening_index": "unknown", "warnings": 0}
          try:
              for line in open(os.environ["LYNIS_OUT"] + "/lynis-report.dat",
                               encoding="utf-8", errors="replace"):
                  if line.startswith("hardening_index="):
                      lynis["hardening_index"] = line.split("=", 1)[1].strip()
                  elif line.startswith("warning[]"):
                      lynis["warnings"] += 1
          except OSError:
              pass
          report = {
              "primary_image": os.environ["PRIMARY_IMAGE"],
              "images": images,
              "cis_docker": cis,
              "lynis": lynis,
              "gate": {"fixable_high_or_critical": fixable_total},
          }
          with open(os.environ["REPORT_JSON"], "w", encoding="utf-8") as fh:
              json.dump(report, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Upload hardening report (sim-tools)
        if: always() && hashFiles('container-hardening.json', 'reports/trivy-sim-tools.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sim-tools-audit
          path: |
            container-hardening.json
            reports/trivy-sim-tools.json
          retention-days: 90
      - name: Upload Trivy JSON report (sim-tools-em)
        if: always() && hashFiles('reports/trivy-sim-tools-em.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sim-tools-em-audit
          path: reports/trivy-sim-tools-em.json
          retention-days: 90
      - name: Post report to issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_JSON: container-hardening.json
          REPORT_MD: ${{ runner.temp }}/hardening-report.md
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$REPORT_MD"
          import json, os
          r = json.load(open(os.environ["REPORT_JSON"], encoding="utf-8"))
          print(f"# Container hardening report\n")
          for name, entry in sorted(r["images"].items()):
              t = entry["trivy"]
              print(f"## {name}\n")
              print(f"Image: `{entry['image']}`\nDigest: `{entry['digest']}`\n")
              print("| Metric | Value |")
              print("|---|---|")
              print(f"| Trivy vulns C/H/M/L | {t['critical']}/{t['high']}/{t['medium']}/{t['low']} |")
              print(f"| Fixable HIGH+CRITICAL | {t['fixable_high_or_critical']} |")
              print(f"| Misconfig pass | {t['misconfig_pass']}/{t['misconfig_total']} |")
              print(f"| Secrets found | {t['secrets']} |")
              print()
          print("## Primary image\n")
          print(f"Image: `{r['primary_image']}`\n")
          print("| Metric | Value |")
          print("|---|---|")
          print(f"| CIS Docker pass/fail | {r['cis_docker']['passed']}/{r['cis_docker']['failed']} |")
          print(f"| Lynis hardening index (trend only) | {r['lynis']['hardening_index']} |")
          print(f"| Lynis warnings | {r['lynis']['warnings']} |")
          print(f"\nRun: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          PY
          # gh issue create fails with "could not add label" when the label
          # does not exist (observed before the first report issue landed).
          gh label create container-hardening --repo "$GITHUB_REPOSITORY" \
            --color d93f0b --description "Container hardening report" --force
          # Match the most recent report issue whether open or closed: a
          # clean run edits the same issue in place instead of creating a
          # fresh one only to close it (the previous code added a new
          # closed issue on every clean scheduled run).
          number_state=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
            --label container-hardening \
            --search "in:title Container hardening report" \
            --limit 1 --json number,state \
            --jq 'if .[0] then "\(.[0].number) \(.[0].state)" else empty end')
          number=${number_state%% *}
          state=$(printf '%s' "${number_state#* }" | tr '[:upper:]' '[:lower:]')
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$REPORT_MD"
          else
            number=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Container hardening report" \
              --label container-hardening --body-file "$REPORT_MD" | sed 's#.*/##')
            state=open
          fi
          gate=$(python3 -c 'import json, os; print(json.load(open(os.environ["REPORT_JSON"], encoding="utf-8"))["gate"]["fixable_high_or_critical"])')
          if [ "$gate" != "0" ] && [ "$state" = "closed" ]; then
            gh issue reopen "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "Findings regressed; report body refreshed."
          elif [ "$gate" = "0" ] && [ "$state" != "closed" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "No fixable HIGH/CRITICAL findings remain."
          fi
