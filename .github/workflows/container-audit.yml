name: Container hardening audit

on:
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Pulls the pinned images from ghcr.io.
      packages: read
      # Uploads the Trivy SARIF scans to code scanning.
      security-events: write
      # Creates, edits, and closes the "Container hardening report" issue.
      issues: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve pinned images
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json

          entries = json.load(open("docker/image-digests.json", encoding="utf-8"))
          pairs = []
          # Audit every published lock entry; entries without a digest
          # (sim_tools_em is not published yet) are skipped.
          for key in sorted(entries):
              entry = entries[key]
              if entry.get("digest"):
                  name = entry["image"].rsplit("/", 1)[-1]
                  pairs.append(f"{name}={entry['image']}@{entry['digest']}")
          if not pairs:
              raise SystemExit("no published images in docker/image-digests.json")
          print("PINNED_IMAGES=" + " ".join(pairs))
          print("PRIMARY_IMAGE=" + pairs[0].split("=", 1)[1])
          PY
          # Reuse the vulnerability DB across the scans in this job.
          echo "TRIVY_CACHE_DIR=$RUNNER_TEMP/trivy-cache" >> "$GITHUB_ENV"
      - name: Pull pinned images
        run: |
          set -euo pipefail
          for pair in $PINNED_IMAGES; do
            docker pull "${pair#*=}"
          done
      # The per-image scans loop over every pinned digest, so they use the
      # trivy CLI (via setup-trivy) rather than one trivy-action step each.
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
      - name: Scan pinned images (Trivy SARIF + JSON)
        run: |
          set -euo pipefail
          mkdir -p sarif reports
          for pair in $PINNED_IMAGES; do
            name="${pair%%=*}"
            ref="${pair#*=}"
            # The digest is frozen; the vulnerability DB is not — these scans
            # surface newly disclosed CVEs against the shipped tools images.
            trivy image --scanners vuln,secret,misconfig \
              --severity CRITICAL,HIGH --ignore-unfixed \
              --format sarif --output "sarif/trivy-${name}.sarif" "$ref"
            trivy image --scanners vuln,secret,misconfig,license \
              --include-non-failures \
              --format json --output "reports/trivy-${name}.json" "$ref"
          done
      - name: Upload Trivy SARIF (sim-tools)
        if: always() && hashFiles('sarif/trivy-sim-tools.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: sarif/trivy-sim-tools.sarif
          category: trivy-sim-tools-audit
      # Dormant until sim_tools_em gains a published digest; hashFiles keeps
      # the step skipped while no SARIF exists for it.
      - name: Upload Trivy SARIF (sim-tools-em)
        if: always() && hashFiles('sarif/trivy-sim-tools-em.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: sarif/trivy-sim-tools-em.sarif
          category: trivy-sim-tools-em-audit
      - name: Run Docker CIS compliance report (primary image)
        run: |
          set -euo pipefail
          trivy image --compliance docker-cis-1.6.0 --report all \
            --format json --output "$RUNNER_TEMP/trivy-cis.json" \
            "${PRIMARY_IMAGE}"
      - name: Run informational Lynis audit inside the primary image
        id: lynis
        continue-on-error: true
        env:
          LYNIS_OUT: ${{ runner.temp }}/lynis-out
        run: |
          set -uo pipefail
          git clone --depth 1 --branch 3.1.7 \
            https://github.com/CISOfy/lynis "$RUNNER_TEMP/lynis"
          # Tags are re-pointable: pin the audit to the exact 3.1.7 commit.
          # A re-pointed tag fails this checkout instead of silently running
          # different audit code.
          git -C "$RUNNER_TEMP/lynis" checkout --detach \
            2e99f92265760b73fd6b139868eb8d4116624030
          # tests/test_workflow_paths.py requires every workflow
          # `docker run --user` to be the image's `sim` user — Lynis runs
          # unprivileged here, which is acceptable for a trend-only audit.
          mkdir -p "$LYNIS_OUT"
          chmod 777 "$LYNIS_OUT"
          docker run --rm --user sim \
            -v "$RUNNER_TEMP/lynis:/lynis:ro" \
            -v "$GITHUB_WORKSPACE/docker/lynis-container.prf:/container.prf:ro" \
            -v "$LYNIS_OUT:/out" \
            --entrypoint /bin/sh "$PRIMARY_IMAGE" \
            -c 'cd /lynis && ./lynis audit system --quick --no-colors \
                --profile /container.prf \
                --report-file /out/lynis-report.dat --logfile /out/lynis.log \
                --auditor github-actions; \
                # Lynis writes its outputs with umask 027 (0640 sim-owned):
                # loosen them so the runner-side grep below can read them.
                chmod 644 /out/lynis-report.dat /out/lynis.log 2>/dev/null' || true
          index=$(grep '^hardening_index=' "$LYNIS_OUT/lynis-report.dat" \
            | head -1 | cut -d= -f2 || true)
          warnings=$(grep -c '^warning\[\]' "$LYNIS_OUT/lynis-report.dat" || true)
          printf 'hardening_index=%s\nwarnings=%s\n' \
            "${index:-unknown}" "${warnings:-0}" >> "$GITHUB_OUTPUT"
      - name: Compute container-hardening report
        env:
          LYNIS_OUT: ${{ runner.temp }}/lynis-out
          REPORTS_DIR: reports
          TRIVY_CIS: ${{ runner.temp }}/trivy-cis.json
          REPORT_JSON: container-hardening.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import os
          import sys
          from collections import Counter

          refs = {}
          for pair in os.environ["PINNED_IMAGES"].split():
              name, ref = pair.split("=", 1)
              refs[name] = ref

          images = {}
          fixable_total = 0
          for path in sorted(glob.glob(os.path.join(os.environ["REPORTS_DIR"],
                                                    "trivy-*.json"))):
              name = os.path.basename(path)[len("trivy-"):-len(".json")]
              trivy = json.load(open(path, encoding="utf-8"))
              vulns, secrets, licenses = Counter(), Counter(), 0
              mis_pass = mis_total = 0
              fixable_high = 0
              for result in trivy.get("Results", []):
                  for v in result.get("Vulnerabilities") or []:
                      sev = v.get("Severity", "UNKNOWN").lower()
                      fixed = bool(v.get("FixedVersion"))
                      vulns[sev] += 1
                      if fixed:
                          vulns[f"{sev}_fixed"] += 1
                          if sev in ("critical", "high"):
                              fixable_high += 1
                  mis = result.get("Misconfigurations") or []
                  for m in mis:
                      mis_total += 1
                      if m.get("Status") == "PASS":
                          mis_pass += 1
                  for s in result.get("Secrets") or []:
                      secrets[s.get("Severity", "UNKNOWN").lower()] += 1
                  for lic in result.get("Licenses") or []:
                      licenses += 1
              image, _, digest = refs.get(name, "@unknown").partition("@")
              images[name] = {
                  "image": image,
                  "digest": digest,
                  "trivy": {
                      "critical": vulns["critical"],
                      "high": vulns["high"],
                      "medium": vulns["medium"],
                      "low": vulns["low"],
                      "fixable_high_or_critical": fixable_high,
                      "misconfig_pass": mis_pass,
                      "misconfig_total": mis_total,
                      "secrets": sum(secrets.values()),
                      "license_findings": licenses,
                  },
              }
              fixable_total += fixable_high
          cis = {"passed": 0, "failed": 0}
          try:
              cis_data = json.load(open(os.environ["TRIVY_CIS"], encoding="utf-8"))
          except (OSError, ValueError):
              cis_data = {}

          # trivy --compliance nests check summaries below the top-level
          # Results; walk the tree recursively so none are missed.
          def _summaries(node):
              yield node
              for child in node.get("Results") or []:
                  yield from _summaries(child)
          for result in _summaries(cis_data):
              summary = result.get("MisconfSummary") or {}
              cis["passed"] += int(summary.get("Successes", 0))
              cis["failed"] += int(summary.get("Failures", 0))
          if cis["passed"] + cis["failed"] == 0:
              # dead telemetry must fail, not masquerade as coverage
              sys.exit("Docker CIS scan produced no results")
          lynis = {"hardening_index": "unknown", "warnings": 0}
          try:
              for line in open(os.environ["LYNIS_OUT"] + "/lynis-report.dat",
                               encoding="utf-8", errors="replace"):
                  if line.startswith("hardening_index="):
                      lynis["hardening_index"] = line.split("=", 1)[1].strip()
                  elif line.startswith("warning[]"):
                      lynis["warnings"] += 1
          except OSError:
              pass
          report = {
              "primary_image": os.environ["PRIMARY_IMAGE"],
              "images": images,
              "cis_docker": cis,
              "lynis": lynis,
              "gate": {"fixable_high_or_critical": fixable_total},
          }
          with open(os.environ["REPORT_JSON"], "w", encoding="utf-8") as fh:
              json.dump(report, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Upload hardening report (sim-tools)
        if: always() && hashFiles('container-hardening.json', 'reports/trivy-sim-tools.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sim-tools-audit
          path: |
            container-hardening.json
            reports/trivy-sim-tools.json
          retention-days: 90
      - name: Upload Trivy JSON report (sim-tools-em)
        if: always() && hashFiles('reports/trivy-sim-tools-em.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sim-tools-em-audit
          path: reports/trivy-sim-tools-em.json
          retention-days: 90
      - name: Post report to issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_JSON: container-hardening.json
          REPORT_MD: ${{ runner.temp }}/hardening-report.md
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$REPORT_MD"
          import json, os
          r = json.load(open(os.environ["REPORT_JSON"], encoding="utf-8"))
          print(f"# Container hardening report\n")
          for name, entry in sorted(r["images"].items()):
              t = entry["trivy"]
              print(f"## {name}\n")
              print(f"Image: `{entry['image']}`\nDigest: `{entry['digest']}`\n")
              print("| Metric | Value |")
              print("|---|---|")
              print(f"| Trivy vulns C/H/M/L | {t['critical']}/{t['high']}/{t['medium']}/{t['low']} |")
              print(f"| Fixable HIGH+CRITICAL | {t['fixable_high_or_critical']} |")
              print(f"| Misconfig pass | {t['misconfig_pass']}/{t['misconfig_total']} |")
              print(f"| Secrets found | {t['secrets']} |")
              print()
          print("## Primary image\n")
          print(f"Image: `{r['primary_image']}`\n")
          print("| Metric | Value |")
          print("|---|---|")
          print(f"| CIS Docker pass/fail | {r['cis_docker']['passed']}/{r['cis_docker']['failed']} |")
          print(f"| Lynis hardening index (trend only) | {r['lynis']['hardening_index']} |")
          print(f"| Lynis warnings | {r['lynis']['warnings']} |")
          print(f"\nRun: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          PY
          # gh issue create fails with "could not add label" when the label
          # does not exist (observed before the first report issue landed).
          gh label create container-hardening --repo "$GITHUB_REPOSITORY" \
            --color d93f0b --description "Container hardening report" --force
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label container-hardening \
            --search "in:title Container hardening report" \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$REPORT_MD"
          else
            number=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Container hardening report" \
              --label container-hardening --body-file "$REPORT_MD" | sed 's#.*/##')
          fi
          gate=$(python3 -c 'import json, os; print(json.load(open(os.environ["REPORT_JSON"], encoding="utf-8"))["gate"]["fixable_high_or_critical"])')
          if [ "$gate" = "0" ] && [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "No fixable HIGH/CRITICAL findings remain."
          fi
