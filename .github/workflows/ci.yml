name: CI

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      base_sha:
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      sim-tools: ${{ steps.scope.outputs.sim-tools }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "sim-tools=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          # The publish trigger negates its generated locks and the
          # docs-only README; mirror that so a lock-only bot branch or a
          # README edit does not rebuild the image it pinned/described.
          grep -Ev '^(docker/image-digests\.json|plugins/sim/tools-image\.json|docker/README\.md)$' \
            "$RUNNER_TEMP/changed-files" > "$RUNNER_TEMP/relevant-files" || true
          # Keep this glob in sync with the publish workflow's paths: list
          # (tests/test_workflow_paths.py asserts the coverage).
          if grep -Eq '^(docker/|src/|plugins/sim/|examples/|scripts/(smoke_image\.py|measure_image_tools\.py|print_locked_image\.py|pull_locked_image\.py|update_image_digest_lock\.py|publish_image_pin_pr\.sh|package_level_sbom\.py)|\.github/workflows/publish-sim-images\.yml|pyproject\.toml$|uv\.lock$|\.dockerignore$|LICENSE$)' "$RUNNER_TEMP/relevant-files"; then
            echo "sim-tools=true" >> "$GITHUB_OUTPUT"
          else
            echo "sim-tools=false" >> "$GITHUB_OUTPUT"
          fi

  dockerfile-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Lint Dockerfiles with hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/sim-tools.Dockerfile
          recursive: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Run BuildKit checks
        run: docker build --check -f docker/sim-tools.Dockerfile .

  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        include:
          # Forward-compatibility canary ahead of the 2026-10-09 stable
          # release: step-level continue-on-error keeps the leg green while
          # the last step reports the failure as an annotation.
          - python-version: "3.15"
            experimental: true
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        id: setup-uv
        continue-on-error: ${{ matrix.experimental || false }}
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: verify-${{ matrix.python-version }}
      - name: Install simulation tools
        id: install-simulation-tools
        continue-on-error: ${{ matrix.experimental || false }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ngspice calculix-ccx
      - name: Verify fast stage
        id: verify-fast-stage
        continue-on-error: ${{ matrix.experimental || false }}
        run: uv run python scripts/verify_all.py --stage fast

      - name: Report 3.15 canary outcome
        if: matrix.experimental && (steps.setup-uv.outcome == 'failure' || steps.install-simulation-tools.outcome == 'failure' || steps.verify-fast-stage.outcome == 'failure')
        run: |
          echo "::warning::Python 3.15 canary leg failed — forward-compat signal, not a gate failure"
  plugin-load:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: plugin-load
      - run: uv sync --locked --group sdk-check
      - run: uv run --group sdk-check python scripts/check_plugin_load.py

  docker-smoke:
    needs: changes
    if: needs.changes.outputs.sim-tools == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      # Writes the shared registry buildcache on push/dispatch runs; fork-PR
      # tokens are clamped to read-only regardless.
      packages: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: docker-smoke
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The GHCR buildcache survives the gha cache's eviction window. The
      # cache lives as a `buildcache` tag on the public sim-tools package so
      # anonymous pulls (local `docker buildx --cache-from`) reuse it too; a
      # separate -buildcache package would default to private. The login is
      # skipped for fork PRs (their token cannot read packages).
      - name: Log in to GHCR for the registry build cache
        id: ghcr-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Read the layers the publish job exports (its default gha scope is
      # the build target name) but export under a separate scope so PR
      # runs never evict the publish cache.
      - name: Build sim-tools image for smoke
        env:
          GHCR: ${{ steps.ghcr-login.outcome == 'success' }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          args=(
            docker buildx build --load --target sim-tools
            -f docker/sim-tools.Dockerfile -t sim-tools:ci
            --cache-from "type=gha,scope=sim-tools"
          )
          if [ "$GHCR" = "true" ]; then
            args+=(--cache-from "type=registry,ref=ghcr.io/$owner/sim-tools:buildcache")
          fi
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GHCR" = "true" ]; then
            args+=(--cache-to "type=registry,ref=ghcr.io/$owner/sim-tools:buildcache,mode=max")
          else
            args+=(--cache-to "type=gha,mode=max,ignore-error=true,scope=sim-tools-ci")
          fi
          "${args[@]}" .
      - run: uv run python scripts/smoke_image.py --image sim-tools:ci
